server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: dongleme-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:donglemei}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:dlm}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      initialization-fail-timeout: -1
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

app:
  jwt:
    secret: ${JWT_SECRET:}
    expire-days: 7
  weather:
    amap-key: ${AMAP_KEY:}
  llm:
    url: ${LLM_API_URL:}
    key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:Qwen/Qwen2.5-7B-Instruct}
