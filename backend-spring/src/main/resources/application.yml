server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: dongleme-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:donglemei}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:dlm}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      initialization-fail-timeout: -1
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

app:
  # 同源部署无需 CORS；仅当本地前端直连 8080 时用逗号分隔填写来源
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  jwt:
    secret: ${JWT_SECRET:}
    expire-days: 7
  login:
    # 登录失败限流：账号维度 5 次 / 15 分钟，IP 维度 30 次 / 15 分钟
    account-max-failures: ${LOGIN_ACCOUNT_MAX_FAILURES:5}
    ip-max-failures: ${LOGIN_IP_MAX_FAILURES:30}
    window-seconds: ${LOGIN_WINDOW_SECONDS:900}
  weather:
    amap-key: ${AMAP_KEY:}
  llm:
    url: ${LLM_API_URL:}
    key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:Qwen/Qwen2.5-7B-Instruct}
